{% extends "base.html" %}
{% block title %}Registrar{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Criar conta</h1>
  <form id="reg-form">
    <label>Nome <input type="text" name="display_name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Senha (mín. 12) <input type="password" name="password" minlength="12" required></label>
    <button type="submit" class="btn primary">Registrar</button>
  </form>
  <p class="muted"><a href="/login">Já tenho conta</a></p>
  <p id="msg" class="msg"></p>
</section>
<script>
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await fetch('/api/auth/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      display_name: fd.get('display_name'),
      email: fd.get('email'),
      password: fd.get('password')
    })
  });
  const data = await res.json();
  if (res.ok) {
    document.getElementById('msg').textContent = 'Conta criada. Faça login.';
    setTimeout(() => location.href = '/login', 1200);
  } else {
    document.getElementById('msg').textContent = data.detail || JSON.stringify(data);
  }
});
</script>
{% endblock %}
